name: Release

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip the release run on semantic-release's own version-bump commits.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node 24 ships npm >= 11.5, required for npm trusted publishing (OIDC).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run checks
        run: bun run check

      # npm auth = trusted publishing: no NPM_TOKEN secret. @semantic-release/npm exchanges this
      # job's GitHub OIDC token (id-token: write, above) for a short-lived npm publish token.
      # The trust relationship is configured on npm: `npm trust github x-relay-mcp --file release.yml
      # --repo gabros20/x-relay` (list with `npm trust list x-relay-mcp`). Publishes also get
      # provenance attestations automatically.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
